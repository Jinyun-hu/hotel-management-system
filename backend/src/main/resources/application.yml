server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: hotel-management
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/hotel_management?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 20051012@Hjy
  sql:
    init:
      mode: never
      schema-locations: classpath:schema.sql
      data-locations: classpath:schema.sql
      username: root
      password: 20051012@Hjy

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*Mapper.xml

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  info:
    title: 酒店管理系统API
    description: 酒店管理系统后端接口文档
    version: 1.0.0

# JWT配置
jwt:
  secret: hotel-management-secret-key-2024
  expiration: 86400000 # 24小时（毫秒）

# 文件上传配置
file:
  upload-path: uploads/
  access-url: /uploads/
